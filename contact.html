<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynix AI</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="header-container">
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="Lynix AI Logo" class="logo">
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Leistungen</a>
      <a href="about.html">Über uns</a>
      <a href="contact.html">Kontakt</a>
    </nav>
  </div>
</header>

<!-- CONTACT -->
<section class="contact-section">
  <h1>Kontakt</h1>
  <p>Schreib uns eine Nachricht – wir melden uns schnellstmöglich.</p>

  <!-- TALLY FORM -->
  <iframe 
    data-tally-src="https://tally.so/embed/2E1709?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
    loading="lazy"
    width="100%"
    height="276"
    frameborder="0"
    marginheight="0"
    marginwidth="0"
    title="Contact Form Template">
  </iframe>

</section>

<!-- TALLY SCRIPT -->
<script>
  var d = document,
      w = "https://tally.so/widgets/embed.js",
      v = function () {
        if (typeof Tally !== "undefined") {
          Tally.loadEmbeds();
        } else {
          d.querySelectorAll("iframe[data-tally-src]:not([src])")
            .forEach(function (e) {
              e.src = e.dataset.tallySrc;
            });
        }
      };

  if (typeof Tally !== "undefined") {
    v();
  } else if (d.querySelector('script[src="' + w + '"]') == null) {
    var s = d.createElement("script");
    s.src = w;
    s.onload = v;
    s.onerror = v;
    d.body.appendChild(s);
  }
</script>

</body>
</html>
